version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: enterprise_user
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: inventory_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
