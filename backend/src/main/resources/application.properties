# ===================================================================
# Application Core Configuration
# ===================================================================
# Sets the unique identity name of this microservice in our system
spring.application.name=telecom-customer-inventory-analytics-system

# ===================================================================
# Database Connection via Environment Variables (.env)
# ===================================================================
# Spring Boot automatically grabs these variables from the root .env file at runtime.
# This prevents hardcoding passwords inside the repository for security.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# ORM (JPA / Hibernate) Settings
# ===================================================================
# Configures the SQL generator to use highly optimized PostgreSQL syntax
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 'update' strategy scans our Java classes and automatically updates the DB tables on startup
spring.jpa.hibernate.ddl-auto=update

# Enables pretty-printed SQL query logging in the IntelliJ console for fast debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
